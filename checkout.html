<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | ThreadAura</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    background: #f4f4f4;
}

header, footer {
    background: #4CAF50;
    color: white;
    text-align: center;
    padding: 15px;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.checkout {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.box {
    flex: 1;
    min-width: 300px;
}

label {
    display: block;
    margin-top: 10px;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #4CAF50;
    color: white;
    border: none;
    margin-top: 15px;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

.total {
    font-weight: bold;
    font-size: 18px;
}
</style>
</head>

<body>

<header>
    <h1>ThreadAura Checkout</h1>
</header>

<div class="container checkout">

<!-- FORM -->
<div class="box">
    <h2>Billing Details</h2>

    <label>Full Name
        <input type="text" id="name" required>
    </label>

    <label>Email
        <input type="email" id="email" required>
    </label>

    <label>Address
        <textarea id="address" required></textarea>
    </label>

    <label>Phone Number
        <input type="tel" id="phone" placeholder="024xxxxxxx" required>
    </label>

    <button onclick="payWithPaystack()">Pay Now</button>
</div>

<!-- SUMMARY -->
<div class="box">
    <h2>Order Summary</h2>

    <p>Sample Product x 1</p>

    <p class="total">
        Total: GHS <span id="total">100.00</span>
    </p>
</div>

</div>

<footer>
    <p>© 2026 ThreadAura</p>
</footer>

<!-- PAYSTACK SCRIPT -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<script>
// total amount
let total = 100;

function payWithPaystack() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;

    if (!name || !email || !phone) {
        alert("Please fill all fields");
        return;
    }

    let handler = PaystackPop.setup({
        key: "pk_test_24c54b797ce3bac2726c38ad05851e526c547624", // 🔴 REPLACE THIS
        email: email,
        amount: total * 100, // Paystack uses pesewas
        currency: "GHS",
        ref: "TX_" + Date.now(),

        metadata: {
            custom_fields: [
                {
                    display_name: "Customer Name",
                    variable_name: "customer_name",
                    value: name
                },
                {
                    display_name: "Phone",
                    variable_name: "phone",
                    value: phone
                }
            ]
        },

        callback: function(response) {
            window.location.href =
                `paymentsuc.html?ref=₵{response.reference}&name=₵{name}&amount=₵{total}`;
        },

        onClose: function() {
            alert("Payment window closed.");
        }
    });

    handler.openIframe();
}
</script>

</body>
</html>
